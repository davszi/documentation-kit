# The kit's own website. Pages for people live in docs/topics/*/index.md and are
# the [[nav]] entries; the guides they explain are records, rendered via
# [[source_pages]] as reference pages that the sidebar's repository tree lists.
title = "Documentation kit"
home_label = "Kit"
gh_repo = "https://github.com/davszi/documentation-kit"
gh_ref = "main"
chapter_reader = true
