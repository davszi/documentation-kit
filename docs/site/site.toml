# The kit's own website. Pages for people live in docs/topics/*/index.md and are
# the [[nav]] entries; the guides they explain are records, rendered via
# [[source_pages]] as reference pages that the sidebar's repository tree lists.
title = "Documentation kit"
gh_repo = "https://github.com/davszi/documentation-kit"
gh_ref = "main"
chapter_reader = true
brand_mark = "docs/site/brand-mark.svg"
# Lint notes for page numbers that no linked record states.
page_number_notes = true
# The kit's own chronology and open work use KIT_ names so they are never
# mistaken for a consuming project's docs/worklog.md or docs/open/OPEN.md.
worklog = "docs/KIT_WORKLOG.md"
# Older entries link files that were deleted later; entries are never rewritten.
# Entries before this day may name the migration guides of versions up to 5.8.0,
# deleted on 27 November 2026; they are in the repository at the tag v5.9.0.
worklog_links_checked_from = "2026-11-27"
open_work = "docs/open/KIT_OPEN.md"
# The Reference section lists the tracked Markdown files under docs/ and the
# two root files named here; the rule files are registered below. CLAUDE.md
# only points agents at AGENTS.md, so it is not named.
reference_roots = ["docs", "AGENTS.md", "THIRD_PARTY.md"]
# Every file directly under tooling/ is a row of the capability map, whose
# Imported by column lint checks against the Python imports.
tooling_roots = ["tooling/"]
capability_map = "docs/KIT_CAPABILITY_MAP.md"
# Lint compiles every formula with the shipped KaTeX in Node.js; the kit's
# checks always have Node, so a run without it fails instead of skipping.
formula_check_required = true

