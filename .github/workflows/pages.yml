name: Publish the kit website

# Builds the kit's own reference site from main and deploys it to GitHub Pages.
# tests/run_checks.sh gates the deploy: unit tests, strict lint, script syntax
# and the real-browser suites. A failed check publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Checks and build run without deploy rights: this job installs and runs
  # third-party code.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the kit
        uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Playwright and Chromium for the browser suites
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "DOCS_PLAYWRIGHT=$RUNNER_TEMP/browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Run the kit checks
        # Test fixtures commit in disposable repositories, so Git needs an identity.
        run: |
          git config --global user.name "Kit checks"
          git config --global user.email "kit-checks@example.invalid"
          DOCS_PYTHON=python DOCS_REQUIRE_BROWSER=1 bash tests/run_checks.sh
      - name: Build the site
        run: python docsite.py build
      - name: Lint strictly
        run: python docsite.py lint --strict
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/docs

  # Only this job may publish, and it runs nothing but the deploy action.
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
